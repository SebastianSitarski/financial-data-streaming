spring:
  application:
    name: financial-data-streaming
  web:
    # API messages (incl. Bean Validation) are always English, regardless of server or client locale
    locale: en
    locale-resolver: fixed
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Jackson 3 based (Spring Kafka 4); JsonSerializer needs Jackson 2, which is not on the runtime classpath
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        # send() blocks the WebSocket receive thread while the broker is unreachable; keep that short
        max.block.ms: 2000
    consumer:
      # default group for consumers that do not declare their own; MarketUpdateListener sets its own
      group-id: financial-data-streaming
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # a record that cannot be deserialized is reported (and skipped by DefaultErrorHandler) instead of
      # blocking the partition forever
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        # matched as an exact package (no sub-packages): the package that holds the Kafka event records
        spring.json.trusted.packages: com.financialdata.streaming.stream

binance:
  base-url: https://data-api.binance.vision
  connect-timeout: 5s
  read-timeout: 10s
  # public market-data-only WebSocket host; combined streams are opened under /stream
  ws-url: wss://data-stream.binance.vision
  stream:
    enabled: true
    initial-backoff: 1s
    max-backoff: 60s
    stable-after: 30s

market-data:
  symbols:
    - BTCUSDT
    - ETHUSDT
    - SOLUSDT
  consumer-group: market-update-processor
  topic:
    name: crypto.market-updates
    partitions: 3
    replication-factor: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
